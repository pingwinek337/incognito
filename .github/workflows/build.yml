name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: Incognito
          path: target/Incognito.jar

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest target/Incognito.jar \
            --title "Incognito (najnowszy build)" \
            --notes "Automatyczny build z commita ${GITHUB_SHA::7}. Wrzuc Incognito.jar do folderu plugins/ (Paper 1.20+)." \
            --target "$GITHUB_SHA"
